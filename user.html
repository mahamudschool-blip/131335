<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>শিক্ষক ও শিক্ষার্থী পোর্টাল</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0f5c3a;--g2:#e4efe8;--ink:#14201a;--mut:#5b6b62;--bg:#f3f6f4;--line:#d3ddd7;--au:#b8892b}
*{box-sizing:border-box}
body{margin:0;font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--g);color:#fff;display:flex;gap:10px;align-items:center;padding:10px 14px}
header img{height:46px;width:46px;object-fit:contain;background:#fff;border-radius:50%;padding:2px}
header b{font-size:15px;line-height:1.3}header small{display:block;opacity:.8;font-size:12px}
.cls{display:none;gap:6px;padding:8px 10px;overflow-x:auto;background:#fff}
.ch{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 16px;font:inherit;white-space:nowrap;cursor:pointer}
.ch.on{background:var(--g);color:#fff;border-color:var(--g)}
.tabs{display:none;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;overflow-x:auto}
.tb{flex:1;border:0;background:none;padding:11px 12px;font:inherit;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tb.on{color:var(--g);border-color:var(--au)}
main{max-width:880px;margin:auto;padding:12px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.row .t{flex:1;min-width:0}.row small{color:var(--mut)}
.th{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--g2);display:grid;place-items:center;color:var(--g);font-weight:700;flex:none}
button.pri,button.sm{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
button.sm{padding:5px 12px;font-size:14px;background:var(--g2);color:var(--g)}
button.sm.rd{background:#fbe9e7;color:#a32619}
button.pri.alt{background:#fff;color:var(--g);border:1px solid var(--g)}
select,input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:100%}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.mr{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;margin-bottom:5px}
.mr input{width:84px;text-align:right}
table.lst{width:100%;border-collapse:collapse;background:#fff;margin-bottom:10px}
.lst th,.lst td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.lst th{background:var(--g2);color:var(--g)}.lst input[type=number]{width:72px}
.fl{display:block;margin-bottom:9px;font-size:14px;color:var(--mut)}.fl input,.fl select{width:100%;color:var(--ink)}
.lgn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;display:grid;gap:8px;max-width:420px;margin-inline:auto}
.lgn h3,h3{margin:0 0 4px;color:var(--g)}
a.lk{display:block;color:var(--g);font-weight:600;text-decoration:none}
#msg{padding:6px 14px;color:var(--mut);font-size:14px}
#md,#ed{display:none;position:fixed;inset:0;background:rgba(10,25,18,.72);overflow:auto;z-index:20;padding:12px}
#ed .box{background:#fff;max-width:520px;margin:auto;padding:14px;border-radius:12px}
#md .bar{justify-content:center}
.card{background:#fff;color:#000;border:2px solid var(--g);border-radius:6px;padding:10px 12px;margin:0 auto 12px;max-width:760px}
.hd{display:flex;gap:10px;align-items:center;border-bottom:2px solid var(--g);padding-bottom:6px}
.hd img{height:54px;width:54px;object-fit:contain}.hd h2{margin:0;font-size:17px;color:var(--g);line-height:1.25}
.hd h3{margin:0;font-size:11px;color:#1b3d2b}.hd p{margin:2px 0 0;font-size:10.5px}
.sb{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;margin:8px 0}
.sb table{font-size:13px;border-collapse:collapse}.sb td{padding:1px 6px 1px 0;vertical-align:top}.sb td:first-child{white-space:nowrap;font-weight:600}
.ph{width:84px;height:100px;object-fit:cover;border:2px solid var(--au);display:grid;place-items:center;font-size:34px;color:var(--g);background:var(--g2);flex:none}
.tt{text-align:center;margin:8px 0 0;font-size:15px;color:var(--g)}
.mt{width:100%;border-collapse:collapse;font-size:13px}
.mt th,.mt td{border:1px solid #444;padding:3px 6px;text-align:center}.mt td:first-child{text-align:left}.mt th{background:var(--g2)}
.sm2{display:flex;flex-wrap:wrap;gap:4px 18px;margin:8px 0;font-size:13px}
.sg{display:flex;justify-content:space-between;margin-top:34px;font-size:12px}.sg span{border-top:1px solid #000;padding-top:2px;min-width:100px;text-align:center}
.ft{text-align:center;background:var(--g);color:#fff;font-size:12px;padding:2px;border-radius:3px}
.sc{max-width:400px}.sc .hd h2{font-size:14px}.sc .ph{width:72px;height:88px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.g2{grid-template-columns:1fr}}
@media print{
@page{size:A4;margin:8mm}
body>*{display:none!important}
#md{display:block!important;position:static;background:none;padding:0;overflow:visible}
#md .bar{display:none}
.card{border-radius:0;margin:0 0 6mm;break-inside:avoid;max-width:none}
.rc{break-after:page}.sc{max-width:none}.g2{gap:5mm}
}
</style></head><body>

 [6,7,8].forEach(n=>c[n]=a.concat(['BGS','Islam','Hindu','ICT']));

 A.role=r.role;merge(r);tab=tabs()[0];render()}

const stl=()=>S.students.filter(s=>s.cls==cl).sort((a,b)=>a.roll-b.roll);
const H=st=>/hindu|হিন্দু/i.test(st.religion||'');
const mk=(c,s,k,r)=>{const e=S.marks.find(x=>x.c==c&&x.s==s&&x.k==k);return e&&e.m[r]!==undefined?e.m[r]:null};
const has=(c,s)=>S.marks.some(x=>x.c==c&&x.s==s);
const gr=p=>p>=80?['A+',5]:p>=70?['A',4]:p>=60?['A-',3.5]:p>=50?['B',3]:p>=40?['C',2]:p>=33?['D',1]:['F',0];
const gl=g=>g>=5?'A+':g>=4?'A':g>=3.5?'A-':g>=3?'B':g>=2?'C':g>=1?'D':'F';
function calc(st){const rows=[];let gp=0,tot=0,fail=false;
 (S.config[st.cls]||[]).forEach(x=>{
  if((x.s=='Islam'&&H(st))||(x.s=='Hindu'&&!H(st))||!has(st.cls,x.s))return;
  const q=mk(st.cls,x.s,'CQ',st.roll),m=mk(st.cls,x.s,'MCQ',st.roll),ab=q===null&&m===null,t=(q||0)+(m||0),f=ab||t<x.pass,g=f?['F',0]:gr(t/(x.cq+x.mcq)*100);
  rows.push({s:x.s,q:q,m:m,t:t,ab:ab,g:g[0],pt:g[1]});tot+=t;gp+=g[1];if(f)fail=true});
 const gpa=fail||!rows.length?0:gp/rows.length;return{rows:rows,tot:tot,gpa:gpa,fail:fail,L:gl(gpa)}}
function ranks(){const L=stl().map(s=>({s:s,r:calc(s)}));
 L.sort((a,b)=>(a.r.fail-b.r.fail)||b.r.gpa-a.r.gpa||b.r.tot-a.r.tot);let p=0;L.forEach(x=>x.pos=x.r.fail?null:++p);return L}
const posOf=roll=>{const x=ranks().find(y=>y.s.roll==roll);return x&&x.pos};

const sCard=st=>`<div class="card sc">${head()}<div class="sb"><table>${F('নাম',st.name)}${F('শ্রেণি',B(st.cls)+', রোল '+B(st.roll))}${F('পিতা',st.father)}${F('জন্ম তারিখ',st.dob)}${F('মোবাইল',st.mobile)}${F('ঠিকানা',st.address)}</table>${pic(st,'ph')}</div><div class="ft">শিক্ষার্থীর পরিচয়পত্র</div></div>`;
const rCard=(st,pos)=>{const r=calc(st);return `<div class="card rc">${head()}<h4 class="tt">${esc(EXAM())} — রেজাল্ট কার্ড</h4><div class="sb"><table>${F('নাম',st.name)}${F('শ্রেণি',B(st.cls))}${F('রোল',B(st.roll))}${F('পিতা',st.father)}${F('মাতা',st.mother)}</table>${pic(st,'ph')}</div>
<table class="mt"><tr><th>বিষয়</th><th>CQ</th><th>MCQ</th><th>মোট</th><th>গ্রেড</th><th>পয়েন্ট</th></tr>${r.rows.map(x=>`<tr><td>${SUBS[x.s]||x.s}</td><td>${x.q===null?'—':B(x.q)}</td><td>${x.m===null?'—':B(x.m)}</td><td>${x.ab?'অনুপস্থিত':B(x.t)}</td><td>${x.g}</td><td>${B(x.pt.toFixed(2))}</td></tr>`).join('')}</table>
<div class="sm2"><span>মোট নম্বর: <b>${B(r.tot)}</b></span><span>জিপিএ: <b>${B(r.gpa.toFixed(2))}</b></span><span>গ্রেড: <b>${r.L}</b></span><span>ফলাফল: <b>${r.fail?'অকৃতকার্য':'উত্তীর্ণ'}</b></span><span>মেধাক্রম: <b>${pos?B(pos):'—'}</b></span></div><div class="sg"><span>শ্রেণিশিক্ষক</span><span>${esc(S.school.head||'প্রধান শিক্ষক')}</span></div></div>`};

 show(k=='s'?`<div class="g2">${L.map(sCard).join('')}</div>`:L.map(s=>rCard(s,P[s.roll])).join(''))}

const toIso=s=>{const m=String(s||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:(s||'')};
function form(F2,v,photo){return F2.map(f=>{const t=f[2]||'text',val=t=='date'?toIso(v[f[0]]):(v[f[0]]==null?'':v[f[0]]);
 if(t.startsWith('s:'))return `<label class="fl">${f[1]}<select data-f="${f[0]}">${t.slice(2).split(',').map(o=>`<option ${o==val?'selected':''}>${o}</option>`).join('')}</select></label>`;
 return `<label class="fl">${f[1]}<input type="${t}" data-f="${f[0]}" value="${esc(val)}"></label>`}).join('')+(photo?`<label class="fl">${photo}<input type="file" id="fimg" accept="image/*"></label>`:'')}
const coll=sel=>{const o={};document.querySelectorAll(sel+' [data-f]').forEach(i=>o[i.dataset.f]=i.value);return o};
function pimg(max){const file=$('fimg')&&$('fimg').files[0];return new Promise(res=>{if(!file)return res('');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82).split(',')[1])};im.src=r.result};r.readAsDataURL(file)})}

 const img=await pimg(420);if(await call({action:'ssave',row:row,data:d,image:img})){cls0();alert('সেভ হয়েছে');await reload()}}
async function delS(row){if(confirm('এই শিক্ষার্থীকে স্থায়ীভাবে মুছবেন?')&&await call({action:'sdelete',row:row})){cls0();await reload()}}
const vAdm=()=>`<h3>নতুন ভর্তি</h3><div id="fa">${form(SF,{cls:cl,gender:'Male',religion:'Islam',roll:(Math.max(0,...stl().map(s=>s.roll))+1)},'ছবি')}</div><button class="pri" onclick="saveS(0,'#fa')">ভর্তি করুন</button>`;

// ---------- প্রমোশন ----------
function vPro(){const L=stl();if(!L.length)return '<p>এই ক্লাসে কেউ নেই।</p>';
 return `<h3>ক্লাস ${B(cl)} থেকে প্রমোশন</h3><div class="bar"><select id="pt">${[6,7,8,9,10].filter(n=>n!=cl).map(n=>`<option value="${n}" ${n==cl+1?'selected':''}>ক্লাস ${B(n)}</option>`).join('')}<option value="0">পাস আউট</option></select><select id="pm"><option value="o">পুরোনো রোল ক্রম</option><option value="n">নামের ক্রম</option><option value="m">রেজাল্ট ক্রম</option></select><button class="sm" onclick="proRoll()">রোল সাজান</button></div>
<table class="lst" id="pl"><tr><th><input type="checkbox" checked onchange="document.querySelectorAll('#pl .pc').forEach(c=>c.checked=this.checked)"></th><th>নাম</th><th>পুরোনো</th><th>নতুন রোল</th></tr>${L.map(s=>`<tr data-r="${s.row}" data-o="${s.roll}"><td><input type="checkbox" class="pc" checked></td><td>${esc(s.name)}</td><td>${B(s.roll)}</td><td><input type="number" class="pn"></td></tr>`).join('')}</table><button class="pri" onclick="doPro()">প্রমোট করুন</button>`}
function proRoll(){const t=+$('pt').value,m=$('pm').value;let L=stl();if(m=='n')L.sort((a,b)=>a.name.localeCompare(b.name,'bn'));if(m=='m')L=ranks().map(x=>x.s);
 const sel=new Set([...document.querySelectorAll('#pl tr[data-r]')].filter(r=>r.querySelector('.pc').checked).map(r=>+r.dataset.r));
 let n=Math.max(0,...S.students.filter(s=>s.cls==t).map(s=>s.roll));
 L.filter(s=>sel.has(s.row)).forEach(s=>{n++;document.querySelector(`#pl tr[data-r="${s.row}"] .pn`).value=t?n:''})}
async function doPro(){const t=+$('pt').value,list=[],seen=new Set(S.students.filter(s=>s.cls==t).map(s=>s.roll));
 for(const r of document.querySelectorAll('#pl tr[data-r]')){if(!r.querySelector('.pc').checked)continue;const n=+r.querySelector('.pn').value;
  if(t&&(!n||seen.has(n))){alert('রোল ফাঁকা বা ডুপ্লিকেট: '+r.cells[1].textContent+'। আগে "রোল সাজান" চাপুন।');return}seen.add(n);list.push({row:+r.dataset.r,cls:t,roll:n})}
 if(!list.length||!confirm(B(list.length)+' জনকে '+(t?'ক্লাস '+B(t):'পাস আউট')+'-এ প্রমোট করবেন?'))return;
 if(await call({action:'promote',list:list})){alert('প্রমোশন হয়েছে');await reload()}}

// ---------- নম্বর ----------
function vMarks(){const L=S.config[cl]||[];
 return `<div class="bar"><select id="ms" onchange="grid()">${L.map(x=>`<option value="${x.s}">${SUBS[x.s]||x.s}</option>`).join('')}</select><select id="mc" onchange="grid()"><option>CQ</option><option>MCQ</option></select><span id="fm"></span></div><div id="mg"></div><button class="pri" onclick="saveM()">সেভ করুন</button>`}
function grid(){const s=$('ms').value,k=$('mc').value,x=(S.config[cl]||[]).find(y=>y.s==s);
 $('fm').textContent=x?'পূর্ণমান: '+B(k=='CQ'?x.cq:x.mcq):'';
 $('mg').innerHTML=stl().map(t=>{const v=mk(cl,s,k,t.roll);return `<label class="mr"><span>${B(t.roll)}. ${esc(t.name)}</span><input type="number" step="any" min="0" data-r="${t.roll}" value="${v===null?'':v}"></label>`}).join('')}
async function saveM(){const m={};document.querySelectorAll('#mg input').forEach(i=>m[i.dataset.r]=i.value===''?'':Number(i.value));
 const s=$('ms').value,k=$('mc').value;if(await call({action:'marks',cls:cl,subject:s,cat:k,marks:m})){alert('সেভ হয়েছে');await reload();$('ms').value=s;$('mc').value=k;grid()}}

// ---------- রেজাল্ট ----------
function vRes(){const L=ranks();if(!L.length)return '<p>শিক্ষার্থী পাওয়া যায়নি।</p>';
 return `<div class="bar"><button class="pri alt" onclick="all('r')">সব রেজাল্ট কার্ড প্রিন্ট</button></div><table class="lst"><tr><th>রোল</th><th>নাম</th><th>মোট</th><th>জিপিএ</th><th>ক্রম</th><th></th></tr>${L.map(x=>`<tr><td>${B(x.s.roll)}</td><td>${esc(x.s.name)}</td><td>${B(x.r.tot)}</td><td>${B(x.r.gpa.toFixed(2))} (${x.r.L})</td><td>${x.pos?B(x.pos):'—'}</td><td><button class="sm" onclick="one('r',${x.s.roll})">কার্ড</button></td></tr>`).join('')}</table>`}

// ---------- শিক্ষক ----------
function vTch(){return (A.role=='admin'?`<div class="bar"><button class="pri" onclick="openT(0)">নতুন শিক্ষক যোগ</button></div>`:'')+(S.teachers.length?S.teachers.map(t=>`<div class="row">${pic(t,'th',100)}<div class="t"><b>${esc(t.name)}</b><br><small>${esc(t.desig)}${t.subject?', '+esc(t.subject):''}${t.mobile?'<br>'+esc(t.mobile):''}</small></div>${A.role=='admin'?`<button class="sm" onclick="openT(${t.row})">সম্পাদনা</button>`:''}</div>`).join(''):'<p>কোনো শিক্ষকের তথ্য নেই।</p>')}
function openT(row){const t=S.teachers.find(x=>x.row==row)||{};ed(`<h3>${row?'শিক্ষকের তথ্য সম্পাদনা':'নতুন শিক্ষক'}</h3><div id="ft">${form(TF,t,'ছবি')}</div><p><button class="pri" onclick="saveT(${row})">সেভ করুন</button> ${row?`<button class="sm rd" onclick="delT(${row})">মুছুন</button>`:''}</p>`)}
async function saveT(row){const d=coll('#ft'),old=S.teachers.find(x=>x.row==row);d.photo=old?old.photo:'';if(!d.name){alert('নাম দিন');return}
 const img=await pimg(420);if(await call({action:'tsave',row:row,data:d,image:img})){cls0();await reload()}}
async function delT(row){if(confirm('এই শিক্ষকের তথ্য মুছবেন?')&&await call({action:'tdelete',row:row})){cls0();await reload()}}

// ---------- লিংক ----------
function vLnk(){const adm=A.role=='admin',L=S.links.map((l,i)=>({l:l,i:i})).filter(x=>adm||A.role=='teacher'||!x.l.cls||x.l.cls==cl);
 return (adm?`<h3>নতুন লিংক যোগ</h3><div id="fl"><label class="fl">ধরন<select data-f="type">${Object.keys(LT).map(k=>`<option value="${k}">${LT[k]}</option>`).join('')}</select></label><label class="fl">শিরোনাম<input data-f="title"></label><label class="fl">লিংক<input data-f="url" placeholder="https://"></label><label class="fl">ক্লাস<select data-f="cls"><option value="">সব ক্লাস</option>${[6,7,8,9,10].map(n=>`<option value="${n}">ক্লাস ${B(n)}</option>`).join('')}</select></label><button class="pri" onclick="addL()">যোগ করুন</button></div><hr>`:'')+
 Object.keys(LT).map(k=>{const g=L.filter(x=>x.l.type==k);return g.length?`<h3>${LT[k]}</h3>`+g.map(x=>`<div class="row"><div class="t"><a class="lk" href="${esc(x.l.url)}" target="_blank" rel="noopener">${esc(x.l.title)}</a><small>${x.l.cls?'ক্লাস '+B(x.l.cls):'সব ক্লাস'}</small></div>${adm?`<button class="sm rd" onclick="delL(${x.i})">মুছুন</button>`:''}</div>`).join(''):''}).join('')||'<p>কোনো লিংক নেই।</p>'}
async function addL(){const d=coll('#fl');if(!d.title||!/^https?:\/\//.test(d.url)){alert('শিরোনাম ও সঠিক লিংক দিন');return}
 const L=S.links.concat([d]);if(await call({action:'links',links:L})){S.links=L;render()}}
async function delL(i){if(!confirm('লিংকটি মুছবেন?'))return;const L=S.links.filter((_,j)=>j!=i);if(await call({action:'links',links:L})){S.links=L;render()}}

// ---------- সেটিং ----------
function vSet(){const L=S.config[cl]||[];
 return `<h3>সংযোগ</h3><p><input id="api" style="width:100%" value="${esc(API)}"></p><button class="sm" onclick="setApi()">লিংক সেভ</button>
<h3 style="margin-top:16px">স্কুলের তথ্য</h3><div id="sch">${form(XF,Object.assign({},DEF,S.school),'স্কুলের লোগো (ঐচ্ছিক)')}</div><button class="pri" onclick="saveSch()">স্কুলের তথ্য সেভ করুন</button>
<h3 style="margin-top:16px">ক্লাস ${B(cl)}: বিষয় ও পূর্ণমান</h3><table class="lst" id="ct"><tr><th></th><th>বিষয়</th><th>CQ</th><th>MCQ</th><th>পাস</th></tr>${Object.keys(SUBS).map(s=>{const x=L.find(y=>y.s==s);return `<tr data-s="${s}"><td><input type="checkbox" class="chk" ${x?'checked':''}></td><td>${SUBS[s]}</td><td><input type="number" data-k="cq" value="${x?x.cq:70}"></td><td><input type="number" data-k="mcq" value="${x?x.mcq:30}"></td><td><input type="number" data-k="pass" value="${x?x.pass:33}"></td></tr>`}).join('')}</table><button class="pri" onclick="saveC()">বিষয়ের তালিকা সেভ করুন</button><p><button class="sm" onclick="out()">লগআউট</button></p>`}
async function saveSch(){const d=coll('#sch'),img=await pimg(300);if(await call({action:'school',school:d,image:img})){alert('সেভ হয়েছে');await reload();hdr()}}
async function saveC(){const c=S.config;c[cl]=[...document.querySelectorAll('#ct tr[data-s]')].filter(r=>r.querySelector('.chk').checked).map(r=>({s:r.dataset.s,cq:+r.querySelector('[data-k=cq]').value,mcq:+r.querySelector('[data-k=mcq]').value,pass:+r.querySelector('[data-k=pass]').value}));
 if(await call({action:'config',config:c}))alert('সেভ হয়েছে')}

// ---------- শিক্ষার্থীর নিজের পাতা ----------
const vMe=()=>`<div class="row">${pic(ME,'th',100)}<div class="t"><b>${esc(ME.name)}</b><br><small>ক্লাস ${B(ME.cls)}, রোল ${B(ME.roll)}</small></div></div><div class="bar"><button class="pri" onclick="show(sCard(ME))">আইডি কার্ড</button><button class="pri" onclick="show(rCard(ME,posOf(ME.roll)))">রেজাল্ট কার্ড</button><button class="sm" onclick="out()">লগআউট</button></div>`;

// ---------- লগইন ও রেন্ডার ----------
function vLogin(){const api=`<details ${API?'':'open'}><summary>সংযোগ লিংক (Web App)</summary><p><input id="api" style="width:100%" value="${esc(API)}" placeholder="https://script.google.com/macros/s/.../exec"></p><button class="sm" onclick="setApi()">সেভ</button></details>`;
 if(ROLE=='admin')return `<div class="lgn"><h3>অ্যাডমিন লগইন</h3><input id="lp" type="password" placeholder="পাসওয়ার্ড"><button class="pri" onclick="lg()">প্রবেশ</button></div>`+api;
 return `<div class="lgn"><h3>শিক্ষক</h3><input id="lp" type="password" placeholder="শিক্ষক পাসওয়ার্ড"><button class="pri" onclick="lg()">প্রবেশ</button></div><div class="lgn"><h3>শিক্ষার্থী</h3><select id="lc">${[6,7,8,9,10].map(n=>`<option value="${n}">ক্লাস ${B(n)}</option>`).join('')}</select><input id="lr" type="number" placeholder="রোল"><label class="fl">জন্ম তারিখ<input id="ld" type="date"></label><button class="pri" onclick="sl()">দেখুন</button></div>`+api}
const TL={stu:'ছাত্রছাত্রী',adm:'ভর্তি',pro:'প্রমোশন',marks:'নম্বর',res:'রেজাল্ট',tch:'শিক্ষক',lnk:'লিংক',set:'সেটিং',me:'আমার কার্ড'};
const V={stu:vStu,adm:vAdm,pro:vPro,marks:vMarks,res:vRes,tch:vTch,lnk:vLnk,set:vSet,me:vMe};
const tabs=()=>A.role=='admin'?['stu','adm','pro','marks','res','tch','lnk','set']:A.role=='teacher'?['stu','marks','res','tch','lnk']:['me','tch','lnk'];
function render(){const on=!!A.role;
 $('cls').style.display=on&&A.role!='student'?'flex':'none';$('tabs').style.display=on?'flex':'none';
 if(!on){$('main').innerHTML=vLogin();return}
 $('cls').innerHTML=[6,7,8,9,10].map(n=>`<button class="ch ${n==cl?'on':''}" onclick="cl=${n};render()">ক্লাস ${B(n)}</button>`).join('');
 $('tabs').innerHTML=tabs().map(k=>`<button class="tb ${k==tab?'on':''}" onclick="tab='${k}';render()">${TL[k]}</button>`).join('');
 $('main').innerHTML=V[tab]();if(tab=='marks'&&(S.config[cl]||[]).length)grid()}
boot();
</script></body></html>
